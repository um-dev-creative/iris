# Iris for this environment. Same scheme as mercury and zerobound, split by sensitivity:
#   config/local.env   (versioned)  non-secret settings. Never a credential.
#   secrets/local.env  (gitignored, copy secrets/local.env.example)  credentials or VAULT_TOKEN; loaded last, so it wins.
# With VAULT_ENABLED=true the BFF fills whatever is still empty from Vault when it starts.
# A .env is optional here: Compose only reads it for the ${VAR:-default} substitutions below, never for the container.
#   docker compose up -d --build
services:
  iris:
    build:
      context: .
      args:
        ENVM: ${ENVM:-production}
    image: lamata/iris:0.1.0
    container_name: iris
    restart: unless-stopped
    env_file:
      - config/local.env
      - secrets/local.env
    environment:
      PORT: "3000"
      NODE_ENV: production
      # Services in the nginx_umdc-net network, without a gateway
      MERCURY_BASE_URL: https://mercury:8118
      MERCURY_API_PREFIX: /api/v1
      MERCURY_HEALTH_PATH: /actuator/health
      BACKBONE_BASE_URL: https://backbone-rest:8084
      BACKBONE_API_PREFIX: /api/v1
      BACKBONE_HEALTH_PATH: /actuator/health
      CORS_ORIGIN: http://localhost:3000
      # nginx terminates TLS; the certificate paths of config/local.env only exist on a developer's machine
      SSL_CERT_PATH: ""
      SSL_KEY_PATH: ""
      # Mercury and backbone-rest serve HTTPS with certificates of the internal CA
      NODE_EXTRA_CA_CERTS: /app/ssl/umdc-local-ca.crt
      TRUST_PROXY: "1"   # nginx is the one proxy in front: the rate limits use the client IP from its X-Forwarded-For
    # A container does not read the host's /etc/hosts: UMDC_GATEWAY_IP (shell or .env) is the machine running nginx
    extra_hosts:
      - "vault.umdc-qa.tst:${UMDC_GATEWAY_IP:-host-gateway}"
    # A missing file stops `docker compose` (create_host_path: false). Issued by ../nginx; override the folder with BFF_TLS_DIR.
    volumes:
      - type: bind
        source: ${BFF_TLS_DIR:-../nginx/config/ssl}/umdc-local-ca.crt
        target: /app/ssl/umdc-local-ca.crt
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "3000:3000"
    networks:
      - nginx_umdc-net

networks:
  nginx_umdc-net:
    external: true
    name: nginx_umdc-net
