name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  build-entornos:
    name: Build por entorno (${{ matrix.envm }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        envm: [development, dev, qa, dev-cloud, qa-cloud, production]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0; versión de pnpm tomada de "packageManager" en package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build SSR (ENVM=${{ matrix.envm }})
        run: pnpm build:ssr
        env:
          ENVM: ${{ matrix.envm }}

  ci:
    name: Build, tests y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # gitleaks revisa todo el historial

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0; versión de pnpm tomada de "packageManager" en package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build de producción (cliente y SSR)
        run: pnpm build:ssr
        env:
          ENVM: production

      - name: Pruebas del frontend (cobertura mínima 85 %)
        run: pnpm test || { echo "::error title=Frontend::Pruebas o cobertura (< 85 %) fallidas; revisa el resumen de cobertura"; exit 1; }

      - name: Pruebas del BFF (cobertura mínima 85 %)
        run: pnpm test:server || { echo "::error title=BFF::Pruebas o cobertura (< 85 %) fallidas; revisa el resumen de cobertura"; exit 1; }

      - name: Resumen de cobertura
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Escaneo de secretos (gitleaks)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --config .gitleaks.toml --redact --verbose
